<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Studio</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:0;
 background:linear-gradient(145deg,#080b18,#171538,#071b2b);
 color:white;font-family:Arial,sans-serif;
 min-height:100vh
}
header{
 text-align:center;padding:22px 10px;
 background:#101428;border-bottom:1px solid #34365b
}
header h1{margin:0;font-size:27px}
header h1 span{color:#22d3ee}
header p{color:#b5bed5;font-size:13px}
main{max-width:800px;margin:auto;padding:14px}
.status{
 background:#111a2d;border:1px solid #34415f;
 padding:12px;border-radius:10px;font-size:13px;
 margin-bottom:12px;color:#b5bed5
}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{
 flex:1;padding:13px 5px;border-radius:10px;
 border:1px solid #394363;background:#151b31;
 color:white;font-weight:bold
}
.tab.active{background:linear-gradient(110deg,#7c3aed,#087eaa)}
.panel{
 background:#11182b;border:1px solid #303b59;
 border-radius:15px;padding:15px;margin-bottom:14px
}
.panel h2{margin-top:0}
.hint{color:#b5bed5;font-size:13px;line-height:1.5}
label{display:block;margin:13px 0 6px;font-size:13px}
input,textarea,select{
 width:100%;padding:12px;border-radius:9px;
 border:1px solid #394363;background:#090f20;
 color:white;font-size:15px
}
textarea{min-height:95px;resize:vertical}
button{cursor:pointer;font-size:15px}
.primary{
 width:100%;padding:13px;margin-top:12px;
 border:0;border-radius:10px;color:white;
 font-weight:bold;background:linear-gradient(110deg,#7c3aed,#0891b2)
}
button:disabled{opacity:.55}
.hidden{display:none!important}
.chatbox{
 height:270px;overflow:auto;background:#080e1e;
 border:1px solid #303b59;border-radius:10px;padding:10px
}
.bubble{
 padding:10px;margin:8px 0;border-radius:10px;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.assistant{background:#1c2945}
.user{background:#49317d}
.chatrow{display:flex;gap:7px;margin-top:10px}
.chatrow input{flex:1;min-width:0}
.chatrow button{
 padding:0 16px;border:0;border-radius:9px;
 background:#7c3aed;color:white;font-weight:bold
}
.result{margin-top:12px;overflow-wrap:anywhere;line-height:1.5}
.result img,.result video{
 display:block;max-width:100%;height:auto;
 border-radius:10px;margin-top:10px
}
.download{
 display:inline-block;margin-top:10px;padding:10px;
 border-radius:8px;background:#263655;color:white;
 text-decoration:none
}
footer{text-align:center;color:#8994b2;font-size:12px;padding:15px}
</style>
</head>

<body>
<header>
<h1>✦ NOVA <span>AI STUDIO</span></h1>
<p>AI Chat • Image Generator • Video Generator</p>
</header>

<main>
<div class="status" id="health">Connecting to Nova server...</div>

<div class="tabs">
<button class="tab active" data-tab="chat">💬 Chat</button>
<button class="tab" data-tab="image">🖼️ Image</button>
<button class="tab" data-tab="video">🎬 Video</button>
</div>

<section class="panel" id="chat">
<h2>Talk to Nova AI</h2>
<p class="hint">Ask questions and chat with
